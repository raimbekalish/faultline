# No host ports or Docker socket: all traffic stays in this disposable project.
x-runtime: &runtime
  image: faultline-sample:${FAULTLINE_PROJECT:?use scripts/experiment.sh}
  build:
    context: ..
    target: runtime
    args:
      REVISION: ${FAULTLINE_REVISION:-development}
  networks: [lab]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.5
  mem_limit: 64m
  pids_limit: 64

services:
  dependency:
    <<: *runtime
    entrypoint: [/app/sample]
    command: [-role, dependency]
    healthcheck:
      test: [CMD, /app/sample, -health]
      interval: 1s
      timeout: 1s
      retries: 15
  frontend:
    <<: *runtime
    entrypoint: [/app/sample]
    command: [-role, frontend]
    depends_on:
      dependency:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    healthcheck:
      test: [CMD, /app/sample, -health]
      interval: 1s
      timeout: 1s
      retries: 15
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    networks: [lab]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 64
  runner:
    <<: *runtime
    profiles: [tools]
    command: [run]
    stop_grace_period: 12s
  test:
    image: faultline-test:${FAULTLINE_PROJECT:?use scripts/experiment.sh}
    build:
      context: ..
      target: dev
    profiles: [tools]
    networks: [lab]
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    command: [go, test, -p, "1", -race, -count=1, -tags=integration, -v, ./...]

networks:
  lab:
    internal: true
