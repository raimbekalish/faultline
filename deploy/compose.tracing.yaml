services:
  frontend:
    environment:
      FAULTLINE_TRACING: jaeger
  dependency:
    environment:
      FAULTLINE_TRACING: jaeger
  runner:
    environment:
      FAULTLINE_TRACING: jaeger
  test:
    environment:
      FAULTLINE_TRACING: jaeger
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: [--config, /etc/jaeger/faultline.yaml]
    volumes:
      - ./jaeger.yaml:/etc/jaeger/faultline.yaml:ro
    networks: [lab]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 64
    stop_grace_period: 8s
